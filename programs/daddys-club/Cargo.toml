[package]
name = "daddys-club"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "daddys_club"

[lints]
workspace = true

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
spl-transfer-hook-interface = { workspace = true }
spl-tlv-account-resolution = { workspace = true }
spl-discriminator = { workspace = true }

[dev-dependencies]
# litesvm на Anchor 0.32.1 не збирається (E0027 на touched_flags) —
# див. docs/PLAN.md, Complexity Tracking.
mollusk-svm = "0.15.0"
# Бонд — Token-2022 із гуком, тому в тесті піднімається саме він. Ознака
# extensions цього крейта НЕ вмикається: вона тягне spl-token-2022-interface,
# а той — spl-list-view 0.1.0, який не збирається (див. корінний Cargo.toml).
# Акаунти з розширеннями харнес складає на spl-token-2022, що вже є в графі
# через anchor-spl.
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = [
  "token",
  "token-2022",
] }
# Референсний емітент піднімається в тому ж харнесі: FR-004 автентифікує
# перехоплення підписом його PDA, і без справжнього байткоду цей шлях не
# перевірити. Залежність циклічна (demo-issuer залежить від цього крейта), але
# лише в dev — cargo такий цикл дозволяє, а SBF-збірка dev-залежностей не бачить.
demo-issuer = { path = "../demo-issuer" }
# Акаунти, які харнес складає руками, мусять бути rent-exempt так само, як ті,
# що їх складає mollusk.
solana-rent = "4.3.0"
# Версії підібрані під mollusk 0.15: він приймає Instruction саме з цих крейтів.
solana-account = "4.3.2"
# ⚠️ 2.6.1 — пін, і тримає його Cargo.lock, бо "2.6.1" тут дозволяє 2.7.0.
# solana-address 2.7.0 тягне wincode 0.6.1, коли решта графа сидить на 0.5.5:
# E0277 «SchemaWrite не реалізовано для Pubkey» на чужому крейті. Полагодженої
# версії немає. Після будь-якого cargo update перевіряти, що у Cargo.lock рівно
# одна версія wincode.
solana-address = "2.6.1"
solana-instruction = "3.4.1"
solana-instruction-error = "2.4.0"
solana-program-error = "3.0.1"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
spl-token-interface = "2.0.0"
# Події Anchor читаються лише з логів, а лог Program data: закодований у base64.
solana-svm-log-collector = "4.2.1"
base64 = "0.22.1"
# Спільні фікстури math.rs ↔ math.ts читаються з тесту як JSON.
serde_json = "1.0.151"
