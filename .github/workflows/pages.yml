# Builds the landing page and the web app and publishes both to GitHub Pages.
#
# One site, two folders: the landing (apps/landing, static, no build) at
# https://<owner>.github.io/<repo>/ and the web app at .../<repo>/app/. The app
# is built with `--base=/<repo>/app/` and routes by hash (`app/#/issue/…`), so
# every app address is its own index.html, served with 200. The root 404.html
# is the landing's: it sends addresses from before the move (`/<repo>/issue/…`)
# to their hash form and offers a way home for anything else.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables)
# configure the cluster the live screen reads from. They are public by nature:
# whatever is baked into a static bundle is visible to every visitor, so an RPC
# key must be one restricted to this site's origin. Left unset, the bundle
# falls back to a local validator, and only the `/live/issue` screen is affected.
#
# One-time setup by the repository owner: Settings → Pages → Source: GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @daddys-club/web build --base=/${{ github.event.repository.name }}/app/
        env:
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_CLUSTER: ${{ vars.VITE_CLUSTER }}
          VITE_PROGRAM_ID: ${{ vars.VITE_PROGRAM_ID }}

      - run: |
          mkdir -p _site
          cp -r apps/landing/. _site/
          cp -r apps/web/dist _site/app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
